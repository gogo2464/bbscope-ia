[package]
name = "bbscope-cli"
description = "A scope aggregator for bug bounty hunters"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bbscope"
path = "src/main.rs"

[features]
default = ["hackerone", "bugcrowd", "intigriti", "yeswehack", "immunefi"]
hackerone = ["bbscope-platforms/hackerone"]
bugcrowd = ["bbscope-platforms/bugcrowd"]
intigriti = ["bbscope-platforms/intigriti"]
yeswehack = ["bbscope-platforms/yeswehack"]
immunefi = ["bbscope-platforms/immunefi"]

[dependencies]
bbscope-core.workspace = true
bbscope-platforms.workspace = true
bbscope-poll.workspace = true
bbscope-storage.workspace = true
bbscope-targets.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
csv.workspace = true
dirs.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
