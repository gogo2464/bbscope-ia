[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/bbscope-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
bbscope-core = { path = "crates/bbscope-core" }
bbscope-platforms = { path = "crates/bbscope-platforms", default-features = false }
bbscope-targets = { path = "crates/bbscope-targets" }
bbscope-storage = { path = "crates/bbscope-storage" }
bbscope-poll = { path = "crates/bbscope-poll" }

anyhow = "1.0.86"
async-trait = "0.1.81"
base64 = "0.22.1"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5.16", features = ["derive", "env"] }
csv = "1.3.0"
data-encoding = "2.6.0"
dirs = "5.0.1"
futures = "0.3.30"
hmac = "0.12.1"
psl = "2.1.55"
regex = "1.10.6"
reqwest = { version = "0.12.7", default-features = false, features = ["rustls-tls", "cookies", "gzip"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
scraper = "0.20.0"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
sha1 = "0.10.6"
thiserror = "1.0.63"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
url = "2.5.2"

[profile.release]
lto = "thin"
strip = true
